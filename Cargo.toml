[package]
name = "secondbrain"
version = "0.2.0"
edition = "2021"
description = "Second Brain — kho tri thức Markdown, web tĩnh và bàn làm việc để duyệt/đăng bằng nút bấm"
publish = false

[[bin]]
name = "secondbrain"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minijinja = { version = "2", features = ["json"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tiny_http = "0.12"
unicode-normalization = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
